<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The November Reset</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#fff6f4;--card:#ffffff;--ink:#4a2e3a;--mute:#9a7886;--rose:#d9718f;--blush:#f9dfe5;--gold:#b98a4e;--line:#f1d3da;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241820;--card:#2f2029;--ink:#f6e6ea;--mute:#b99aa6;--rose:#ee8aa8;--blush:#43303a;--gold:#d9ae72;--line:#4b3641;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241820;--card:#2f2029;--ink:#f6e6ea;--mute:#b99aa6;--rose:#ee8aa8;--blush:#43303a;--gold:#d9ae72;--line:#4b3641;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-weight:400;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0}
.hero{text-align:center;padding:26px 14px 18px}
.eyebrow{letter-spacing:.3em;font-size:11px;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(40px,10vw,60px);line-height:1;margin:8px 0;color:var(--rose);font-style:italic}
.sub{color:var(--mute);font-size:14px}
.intent{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px;max-width:560px;margin:14px auto 0;color:var(--ink)}
.stats{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 18px;min-width:110px}
.stat b{display:block;font-family:"Cormorant Garamond",serif;font-size:28px;color:var(--rose);line-height:1.1}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:18px 0}
.dot{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:11px;color:var(--mute);cursor:pointer;padding:0;position:relative;overflow:hidden;font-family:inherit}
.dot i{position:absolute;left:0;right:0;bottom:0;background:var(--blush);z-index:0}
.dot em{position:relative;z-index:1;font-style:normal}
.dot.full{background:var(--rose);border-color:var(--rose);color:#fff}
.dot.sel{outline:2px solid var(--gold);outline-offset:2px;color:var(--ink);font-weight:500}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:8px 16px;font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 18px 14px;margin-bottom:14px;box-shadow:0 6px 22px -14px rgba(217,113,143,.5)}
.card h2{font-size:25px;color:var(--rose)}
.card h3{font-size:19px;margin:12px 0 4px}
.time{font-size:12px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.bar{height:7px;border-radius:9px;background:var(--blush);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:9px;transition:width .4s}
.promise{background:var(--blush);border-radius:18px;padding:14px 18px;margin-bottom:14px;text-align:center;font-family:"Cormorant Garamond",serif;font-size:20px;font-style:italic}
.promise small{display:block;font:11px Jost;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-style:normal;margin-bottom:2px}
label.ck{display:flex;gap:11px;align-items:flex-start;padding:7px 0;cursor:pointer;font-size:15px}
label.ck small{display:block;color:var(--mute);font-size:12.5px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border:1.5px solid var(--rose);border-radius:50%;margin:1px 0 0;cursor:pointer;display:grid;place-content:center;background:transparent}
input[type=checkbox]:checked{background:var(--rose)}
input[type=checkbox]:checked::after{content:"✓";color:#fff;font-size:13px;line-height:1}
label.ck:has(input:checked) span{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line)}
.pri{display:flex;gap:10px;align-items:center;margin:6px 0}
.pri input[type=text]{flex:1}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 13px;font:inherit;font-size:15px;outline:none}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus{border-color:var(--rose)}
.fl{display:block;font-family:"Cormorant Garamond",serif;font-size:18px;margin:14px 0 5px;color:var(--ink)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nav button,.seg button{border:1px solid var(--line);background:var(--card);color:var(--rose);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button.on{background:var(--rose);color:#fff}
.mood{display:flex;gap:6px;flex-wrap:wrap}
.mood button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.mood button.on{background:var(--blush);border-color:var(--rose)}
ol.rules{padding-left:0;list-style:none;counter-reset:r;margin:8px 0}
ol.rules li{counter-increment:r;display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
ol.rules li::before{content:counter(r);font-family:"Cormorant Garamond",serif;font-size:24px;color:var(--gold);width:22px;flex:none;line-height:1.1}
.letter{font-family:"Cormorant Garamond",serif;font-size:19px;font-style:italic;line-height:1.6}
.grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:26px;letter-spacing:.08em}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">30 days of becoming my own priority</div>
    <h1>The November Reset</h1>
    <div class="sub">November 3 – December 2, 2026</div>
    <p class="intent">I am building a life that I am excited to wake up to. I don’t need to change everything overnight. I need to stop abandoning myself.</p>
    <div class="stats" id="stats"></div>
  </header>
  <div class="strip" id="strip"></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <div class="foot">♡ restart without guilt, always ♡</div>
</div>
<script>
var START=new Date(2026,10,3),S={};
try{S=JSON.parse(localStorage.getItem('nr')||'{}')}catch(e){}
function save(){try{localStorage.setItem('nr',JSON.stringify(S))}catch(e){}}
var RULES=["I will plan my days instead of living reactively.","I will keep small promises to myself.","I will invest in my career every week.","I will take care of my appearance even on ordinary days.","I will make time for creativity and hobbies.","I will learn to manage my emotions instead of letting them control my decisions.","I will not sacrifice sleep, health or happiness for productivity.","I will restart without guilt whenever I fall off track."];
var R=[["Morning","7:30–9:00 AM",["Wake up and make my bed","Drink water and get ready","Skincare, grooming and outfit","Write my morning journal","Eat breakfast","Review my three priorities"]],
["Workday","9:00 AM–5:00 PM",["Focus on my responsibilities","Take a proper lunch break","Walk whenever possible","Learn something from my work","Avoid unnecessary scrolling"]],
["Evening","5:30–11:00 PM",["5:30 · Decompress and have a snack","6:00 · Exercise or walk","6:30 · Career learning (3–4 days a week)","7:30 · Dinner","8:30 · Creative time, reading or personal projects","9:30 · Organise tomorrow","10:00 · Evening journal and skincare","10:30 · Wind down","11:00 · Target bedtime"]]];
var P=[["Discipline","Plan tomorrow · three important tasks · realistic sleep · less mindless scrolling",["Plan tomorrow every evening","Complete three important tasks","Maintain a realistic sleep schedule","Reduce mindless scrolling"]],
["Career & intelligence","Learning sessions · read or study · technical project · document wins",["Four focused learning sessions weekly","Read or study something useful","Develop one technical project","Document professional achievements"]],
["Emotional independence","Notice triggers · pause before reacting · enjoy time alone",["Identify emotional triggers","Pause before reacting","Practise communicating needs calmly","Enjoy time alone","Stop making my day depend on someone else’s attention"]],
["Feminine self-care","Skincare & haircare · intentional outfit · movement & nutrition",["Follow skincare and haircare routines","Wear outfits intentionally","Maintain personal hygiene and grooming","Make time for movement and nutrition","Feel presentable for myself"]],
["Creativity","Draw twice a week · makeup & styling · inspiration folder · one project",["Draw twice a week","Experiment with makeup and styling","Maintain a fashion and content inspiration folder","Explore one creative project"]]];
var MOODS=["Glowing","Calm","Okay","Tired","Anxious","Low"];
function clamp(n){return Math.max(0,Math.min(29,n))}
var today=clamp(Math.floor((new Date()-START)/864e5)),cur=today,tab='today',jt='m',wk=Math.min(4,Math.floor(today/7));
var TOTAL=R.reduce(function(a,g){return a+g[2].length},0)+P.length;
function dk(x,n){return 'd'+(n==null?cur:n)+'.'+x}
function pct(n){var c=0;R.forEach(function(g,gi){g[2].forEach(function(_,i){if(S[dk('c.r'+gi+'_'+i,n)])c++})});P.forEach(function(_,i){if(S[dk('c.p'+i,n)])c++});return c/TOTAL}
function dstr(n){var d=new Date(START.getTime()+n*864e5);return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
function ck(key,label,sm){return '<label class="ck"><input type="checkbox" data-k="'+key+'"><span>'+label+(sm?'<small>'+sm+'</small>':'')+'</span></label>'}
function fld(label,key,tag){return '<label class="fl">'+label+'</label>'+(tag==='i'?'<input type="text" data-k="'+key+'">':'<textarea data-k="'+key+'"></textarea>')}
function pri(){var h='';for(var i=1;i<=3;i++)h+='<div class="pri"><input type="checkbox" data-k="'+dk('c.pri'+i)+'"><input type="text" data-k="'+dk('pri'+i)+'" placeholder="Priority '+i+'"></div>';return h}
function head(){
  var done=0,sum=0;for(var i=0;i<30;i++){var p=pct(i);sum+=p;if(p>=.8)done++}
  document.getElementById('stats').innerHTML='<div class="stat"><b>Day '+(today+1)+'</b><span>of 30</span></div><div class="stat"><b>'+Math.round(pct(today)*100)+'%</b><span>today</span></div><div class="stat"><b>'+done+'</b><span>strong days</span></div>';
  var s='';for(var i=0;i<30;i++){var p=pct(i);s+='<button class="dot'+(p>=.8?' full':'')+(i===cur?' sel':'')+'" data-d="'+i+'" title="'+dstr(i)+'"><i style="height:'+Math.round(p*100)+'%"></i><em>'+(i+1)+'</em></button>'}
  document.getElementById('strip').innerHTML=s;
  var T=[['today','Today'],['journal','Journal'],['week','Weekly'],['rules','Rules & Pillars'],['end','Day 30']],t='';
  T.forEach(function(x){t+='<button class="tab'+(tab===x[0]?' on':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>'});
  document.getElementById('tabs').innerHTML=t;
}
function dayNav(){return '<div class="nav"><button data-s="-1">‹</button><h3 style="margin:0">'+dstr(cur)+'</h3><button data-s="1">›</button></div>'}
function vToday(){
  var p=Math.round(pct(cur)*100),h=dayNav()+'<div class="promise"><small>Today’s promise</small>'+RULES[cur%8]+'</div>';
  h+='<div class="card"><h2>My three priorities</h2>'+pri()+'<div class="bar"><i style="width:'+p+'%"></i></div><div class="sub">'+p+'% of today complete</div></div>';
  R.forEach(function(g,gi){h+='<div class="card"><h2>'+g[0]+'</h2><div class="time">'+g[1]+'</div>';g[2].forEach(function(it,i){h+=ck(dk('c.r'+gi+'_'+i),it)});h+='</div>'});
  h+='<div class="card"><h2>My five pillars</h2><div class="time">did I show up for…</div>';
  P.forEach(function(x,i){h+=ck(dk('c.p'+i),x[0],x[1])});
  return h+'</div>';
}
function vJournal(){
  var h=dayNav()+'<div class="seg"><button data-j="m" class="'+(jt==='m'?'on':'')+'">Morning</button><button data-j="e" class="'+(jt==='e'?'on':'')+'">Evening</button></div><div class="card">';
  if(jt==='m'){
    h+='<h2>Morning journal</h2><label class="fl">Mood</label><div class="mood">'+MOODS.map(function(m){return '<button data-mood="'+m+'" class="'+(S[dk('mood')]===m?'on':'')+'">'+m+'</button>'}).join('')+'</div>';
    h+='<label class="fl">Energy level (1–10)</label><input type="number" min="1" max="10" data-k="'+dk('energy')+'" style="max-width:110px">';
    h+=fld('Who am I choosing to be today?',dk('who'))+'<label class="fl">My three priorities</label>'+pri();
    h+=fld('One thing I must complete for my future',dk('future'),'i')+fld('One thing I will do for my appearance or health',dk('health'),'i')+fld('One thing I will do purely because I enjoy it',dk('joy'),'i')+fld('Today’s affirmation',dk('aff'),'i');
  }else{
    h+='<h2>Evening journal</h2>';
    ['What did I accomplish today?','What did I avoid or procrastinate on?','What emotion influenced my decisions today?','Did I act like the woman I want to become?','What did I learn today?','What am I proud of?','What is tomorrow’s improvement?'].forEach(function(q,i){h+=fld((i+1)+'. '+q,dk('e'+i))});
  }
  return h+'</div>';
}
function vWeek(){
  var a=wk*7+1,b=Math.min(30,a+6),sa=new Date(START.getTime()+(a-1)*864e5).toLocaleDateString('en-US',{month:'short',day:'numeric'}),sb=new Date(START.getTime()+(b-1)*864e5).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  var avg=0,n=0;for(var i=a-1;i<b;i++){avg+=pct(i);n++}
  var h='<div class="nav"><button data-w="-1">‹</button><h3 style="margin:0">Week '+(wk+1)+' · '+sa+' – '+sb+'</h3><button data-w="1">›</button></div><div class="card"><h2>Weekly review</h2><div class="bar"><i style="width:'+Math.round(avg/n*100)+'%"></i></div><div class="sub">Routine completion this week: '+Math.round(avg/n*100)+'%</div>';
  ['What went well?','What drained me?','What did I learn?','Which habit was easiest?','Which habit was hardest?','What am I avoiding?','What do I want to improve next week?','My three priorities for the coming week'].forEach(function(q,i){h+=fld(q,'w'+wk+'.'+i)});
  return h+'</div>';
}
function vRules(){
  var h='<div class="card"><h2>My personal rules</h2><ol class="rules">'+RULES.map(function(r){return '<li>'+r+'</li>'}).join('')+'</ol></div><div class="card"><h2>My five pillars</h2>';
  P.forEach(function(x,i){h+='<h3>'+(i+1)+'. '+x[0]+'</h3>'+x[2].map(function(t){return '<div class="sub">♡ '+t+'</div>'}).join('')});
  return h+'</div>';
}
function vEnd(){
  var h='<div class="card"><h2>Day 30 reflection</h2>';
  ['What has changed about me?','Which habits have become easier?','Am I more confident in my career direction?','Have I become more emotionally independent?','Am I taking better care of myself?','What did I discover about my interests?','What do I want to continue in December?'].forEach(function(q,i){h+=fld(q,'f.'+i)});
  h+='</div><div class="card letter"><h2>A letter to my future self</h2><p>Dear future me,</p><p>I hope you remember that this transformation started with a decision to stop living on autopilot.</p><p>I am proud of the effort I have made, even when it wasn’t perfect.</p><p>With love,<br>Me.</p></div>';
  return h;
}
function render(){
  head();
  document.getElementById('view').innerHTML={today:vToday,journal:vJournal,week:vWeek,rules:vRules,end:vEnd}[tab]();
  document.querySelectorAll('[data-k]').forEach(function(el){
    var v=S[el.dataset.k];
    if(el.type==='checkbox'){el.checked=!!v;el.onchange=function(){S[el.dataset.k]=el.checked;save();render()}}
    else{if(v!=null)el.value=v;el.oninput=function(){S[el.dataset.k]=el.value;save();
      var m=el.dataset.k.match(/pri\d$/);if(m)document.querySelectorAll('[data-k="'+el.dataset.k+'"]').forEach(function(o){if(o!==el)o.value=el.value})}}
  });
}
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;var d=t.dataset;
  if(d.d!=null){cur=+d.d;if(tab==='week'||tab==='rules'||tab==='end')tab='today'}
  else if(d.t)tab=d.t;
  else if(d.s){cur=clamp(cur+ +d.s)}
  else if(d.j)jt=d.j;
  else if(d.w){wk=Math.max(0,Math.min(4,wk+ +d.w))}
  else if(d.mood){S[dk('mood')]=S[dk('mood')]===d.mood?'':d.mood;save()}
  else return;
  render();
});
render();
</script>
</body>
</html>
